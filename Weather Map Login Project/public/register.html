<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Регистрация</title>
  <script defer src="js/register.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="flex items-center justify-center h-screen bg-gray-100">
  <div class="bg-white p-8 rounded-xl shadow-md w-96">
    <h1 class="text-2xl font-bold mb-4">Регистрация</h1>
    <input id="name" type="text" placeholder="Имя" class="mb-2 w-full p-2 border rounded">
    <input id="email" type="email" placeholder="Email" class="mb-2 w-full p-2 border rounded">
    <input id="password" type="password" placeholder="Пароль" class="mb-4 w-full p-2 border rounded">
    <button onclick="register()" class="bg-green-500 text-white w-full py-2 rounded">Зарегистрироваться</button>
  </div>
</body>
</html>
