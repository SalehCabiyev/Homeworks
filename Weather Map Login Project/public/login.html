<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Вход</title>
  <script defer src="js/login.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="flex items-center justify-center h-screen bg-gray-100">
  <div class="bg-white p-8 rounded-xl shadow-md w-96">
    <h1 class="text-2xl font-bold mb-4">Вход</h1>
    <input id="email" type="email" placeholder="Email" class="mb-2 w-full p-2 border rounded">
    <input id="password" type="password" placeholder="Пароль" class="mb-4 w-full p-2 border rounded">
    <button onclick="login()" class="bg-blue-500 text-white w-full py-2 rounded">Войти</button>
    <p class="mt-4 text-center text-sm">Нет аккаунта? <a href="register.html" class="text-blue-600">Регистрация</a></p>
  </div>
</body>
</html>
