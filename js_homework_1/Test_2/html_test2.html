<!DOCTYPE html>
<html lang="Enter">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
        }
        .modal{
             display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
        }
        .modal-content {
            background: white;
            padding: 20px;
            border-radius: 5px;
            text-align: center;
            width: 300px;
        }
        button {
            margin-top: 10px;
            padding: 8px 12px;
        }
    </style>
</head>
<body>
   <button id="openBtn">
Открыть
   </button>
<div id="modal" class="modal">
    <div class="modal-content">
        <p>
            Это модальное окно.
        </p>
        <button id="closeBtn">Закрыть</button>

    </div>
    <script src="java.js"></script>

</div>
    
</body>
</html>
